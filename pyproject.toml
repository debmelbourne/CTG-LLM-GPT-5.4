[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ctg-llm-reproducibility"
version = "1.0.1"
description = "Public inference, rendering and analysis components for a cardiotocography LLM study"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Debjyoti Karmakar"}, {name = "Erica Spessot"},
  {name = "Enes Makalic"}, {name = "Fiona Brownfoot"}
]
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.8",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
inference = ["openai==2.54.0", "azure-identity==1.27.0", "azure-storage-blob==12.31.1", "jsonschema==4.26.0"]
verification = ["jsonschema==4.26.0"]
rendering = ["wfdb==4.3.1"]
evaluation = ["statsmodels==0.14.6", "patsy==1.0.3"]

[project.scripts]
ctg-llm = "ctg_llm.cli:main"
ctg-llm-infer = "ctg_llm.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctg_llm = ["resources/prompts/*.txt", "resources/schemas/*.json"]
